<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starfall Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #f0eeff;
      overflow: hidden;
    }

    #game-wrap {
      position: relative;
      border: 3px solid #2e2e58;
      box-shadow: 0 0 40px rgba(107,228,255,0.15);
      width: min(800px, 100vw);
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      width: 100%;
      height: auto;
    }

    #back-btn {
      margin-top: 1.25rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: .6rem 1.2rem;
      background: transparent;
      color: #8886b0;
      border: 2px solid #2e2e58;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all .2s;
      text-decoration: none;
    }

    #back-btn:hover { color: #6be4ff; border-color: #6be4ff; }

    /* Mobile touch controls */
    #touch-controls {
      display: none;
      width: min(800px, 100vw);
      justify-content: space-between;
      align-items: center;
      padding: .5rem 1rem;
      gap: .5rem;
      margin-top: .25rem;
    }

    .touch-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      padding: .8rem 1.4rem;
      background: rgba(107,228,255,0.12);
      color: #6be4ff;
      border: 2px solid #2e2e58;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      flex: 1;
      text-align: center;
    }

    #touch-jump {
      flex: 1;
      background: rgba(255,107,203,0.15);
      color: #ff6bcb;
      border-color: #ff6bcb44;
      font-size: 12px;
      padding: 1rem;
    }

    @media (max-width: 600px) {
      #touch-controls { display: flex; }
      body { padding: 0; justify-content: flex-start; padding-top: .5rem; }
    }
  </style>
</head>
<body>

<div id="game-wrap">
  <canvas id="canvas" width="800" height="400"></canvas>
</div>
<div id="touch-controls">
  <button class="touch-btn" id="touch-jump" ontouchstart="doJump()" onclick="doJump()">▲ TAP TO JUMP</button>
</div>
<a href="index.html" id="back-btn">← Back to PixelVault</a>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// ── Palette ──
const COL = {
  bg:       '#0d0d1a',
  bgMid:    '#11112a',
  ground:   '#1e1e38',
  groundTop:'#6be4ff',
  player:   '#ff6bcb',
  playerGlow:'#ff006680',
  shield:   '#6be4ffa0',
  asteroid: '#ff8f6b',
  asteroidDark:'#7a2c00',
  stardust: '#ffe66b',
  text:     '#f0eeff',
  muted:    '#8886b0',
  accent:   '#6be4ff',
  danger:   '#ff4444',
  ground2:  '#16162a',
};

// ── State ──
let state = 'start'; // 'start' | 'playing' | 'dead'
let score, speed, frameCount, highScore;
let stars, bgStars, particles, asteroids, dustParticles;
let player;
let lastTime = 0;

function init() {
  score = 0;
  speed = 3;
  frameCount = 0;
  highScore = highScore || 0;

  // Scrolling bg stars (parallax layers)
  bgStars = Array.from({length: 80}, () => ({
    x: Math.random() * W,
    y: Math.random() * (H - 80),
    r: Math.random() < 0.3 ? 2 : 1,
    speed: 0.3 + Math.random() * 0.8,
    alpha: 0.2 + Math.random() * 0.8,
  }));

  // Ground decoration stars
  stars = Array.from({length: 12}, () => ({
    x: Math.random() * W,
    y: H - 60 + Math.random() * 40,
    size: 2 + Math.random() * 3,
    color: [COL.accent, COL.stardust, '#6bff9e'][Math.floor(Math.random()*3)],
  }));

  particles = [];
  dustParticles = [];
  asteroids = [];

  player = {
    x: 120,
    y: H - 80 - 24,
    w: 28,
    h: 24,
    vy: 0,
    onGround: true,
    jumping: false,
    jumpCount: 0,   // allow double jump
    maxJumps: 2,
    frame: 0,
    frameTimer: 0,
    trail: [],
    invincible: 0,
    shieldTimer: 0,
  };
}

// ── Input ──
const GROUND_Y = H - 80;

function doJump() {
  if (state === 'start') { state = 'playing'; init(); return; }
  if (state === 'dead')  { state = 'playing'; init(); return; }
  if (player.jumpCount < player.maxJumps) {
    player.vy = -13;
    player.onGround = false;
    player.jumping = true;
    player.jumpCount++;
    spawnJumpParticles();
  }
}

canvas.addEventListener('click', doJump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); doJump(); }, {passive:false});

// Swipe up to jump on mobile
let touchStartY = 0;
canvas.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (dy > 20) doJump();
}, {passive:true});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); doJump(); }
});

// ── Particles ──
function spawnJumpParticles() {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: player.x + player.w/2,
      y: player.y + player.h,
      vx: (Math.random()-0.5)*4,
      vy: Math.random()*3+1,
      life: 1,
      decay: 0.05+Math.random()*0.05,
      r: 3+Math.random()*3,
      color: COL.accent,
    });
  }
}

function spawnExplosion(x, y) {
  for (let i = 0; i < 24; i++) {
    const angle = (i/24)*Math.PI*2;
    const spd = 2+Math.random()*5;
    particles.push({
      x, y,
      vx: Math.cos(angle)*spd,
      vy: Math.sin(angle)*spd,
      life: 1,
      decay: 0.03+Math.random()*0.04,
      r: 3+Math.random()*5,
      color: [COL.asteroid, COL.stardust, COL.player][Math.floor(Math.random()*3)],
    });
  }
}

function spawnDust() {
  dustParticles.push({
    x: player.x,
    y: GROUND_Y,
    vx: -speed - Math.random()*2,
    vy: -(Math.random()*1.5),
    life: 1,
    decay: 0.08,
    r: 2+Math.random()*2,
  });
}

// ── Asteroid spawning ──
function spawnAsteroid() {
  const types = [
    { w:22, h:20, color: COL.asteroid, dark: COL.asteroidDark, y: GROUND_Y - 20, lane:'ground' },
    { w:18, h:16, color:'#a06bff',     dark:'#3d0080',          y: GROUND_Y - 110, lane:'mid' },
    { w:26, h:24, color: COL.stardust, dark:'#7a6100',          y: GROUND_Y - 55,  lane:'ground' },
  ];
  const t = types[Math.floor(Math.random()*types.length)];
  asteroids.push({
    x: W + 40,
    y: t.y,
    w: t.w, h: t.h,
    color: t.color, dark: t.dark,
    spin: 0,
    spinSpeed: (Math.random()-0.5)*0.15,
    wobble: Math.random()*Math.PI*2,
  });
}

// ── Drawing helpers ──
function drawPixelRect(x, y, w, h, color, shadow) {
  // Pixelated block with a drop shadow
  ctx.fillStyle = shadow || '#0005';
  ctx.fillRect(Math.round(x+3), Math.round(y+3), w, h);
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function drawShip(x, y, w, h, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const cx = x + w/2, cy = y + h/2;

  // Thruster glow
  const grd = ctx.createRadialGradient(x-2, cy, 1, x-2, cy, 18);
  grd.addColorStop(0, '#ff8f6b');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(x-20, cy-14, 22, 28);

  // Body — pixel blocks
  const blocks = [
    // [col, row, w, h] in 4px units relative to x,y
    [1,1,5,1], // top fin
    [0,2,7,3], // main body
    [1,3,1,2], // cockpit dark
    [7,2,1,3], // nose
    [-1,3,2,1], // tail
  ];
  const px = 4;
  blocks.forEach(([c,r,bw,bh]) => {
    ctx.fillStyle = (r===3&&c===1) ? '#1a0016' : (r===3&&c>=0) ? COL.player : '#ff9ddf';
    ctx.fillRect(Math.round(x + c*px), Math.round(y + r*px), bw*px, bh*px);
  });

  // Cockpit shine
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillRect(Math.round(x+px*2), Math.round(y+px*1.5), 4, 4);

  // Thruster flame (animated)
  const flicker = 0.7 + Math.sin(Date.now()*0.02)*0.3;
  ctx.fillStyle = '#ffe66b';
  ctx.fillRect(Math.round(x-8), Math.round(cy-4), Math.round(10*flicker), 4);
  ctx.fillStyle = '#ff8f6b';
  ctx.fillRect(Math.round(x-6), Math.round(cy), Math.round(8*flicker), 3);

  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(Math.round(a.x + a.w/2), Math.round(a.y + a.h/2));
  ctx.rotate(a.spin);

  // Shadow
  ctx.fillStyle = '#0005';
  ctx.fillRect(-a.w/2+3, -a.h/2+3, a.w, a.h);

  // Main body (chunky pixel octagon-ish)
  const hw = a.w/2, hh = a.h/2;
  ctx.fillStyle = a.dark;
  ctx.fillRect(-hw, -hh+4, a.w, a.h-8);
  ctx.fillRect(-hw+4, -hh, a.w-8, a.h);
  ctx.fillStyle = a.color;
  ctx.fillRect(-hw+2, -hh+2, a.w-4, a.h-4);

  // Crater
  ctx.fillStyle = a.dark;
  ctx.fillRect(-4, -4, 6, 6);
  ctx.fillRect(-2, -2, 2, 2);

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(-hw+4, -hh+4, 6, 4);

  ctx.restore();
}

function drawGround() {
  // Ground base
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // Top line (cyan pixel line)
  ctx.fillStyle = COL.groundTop;
  ctx.fillRect(0, GROUND_Y, W, 3);

  // Scrolling grid lines
  ctx.fillStyle = '#ffffff10';
  const lineSpacing = 60;
  const offset = (frameCount * speed * 0.5) % lineSpacing;
  for (let x = -offset; x < W; x += lineSpacing) {
    ctx.fillRect(Math.round(x), GROUND_Y, 2, H - GROUND_Y);
  }

  // Ground stars/collectibles (scroll)
  stars.forEach(s => {
    ctx.fillStyle = s.color;
    ctx.globalAlpha = 0.5 + Math.sin(frameCount*0.05 + s.x)*0.3;
    ctx.fillRect(Math.round(s.x), Math.round(s.y), s.size, s.size);
    ctx.globalAlpha = 1;
  });
}

function drawBg() {
  // Deep space gradient
  const grd = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grd.addColorStop(0, '#070714');
  grd.addColorStop(1, '#11112a');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // Parallax bg stars
  bgStars.forEach(s => {
    ctx.globalAlpha = s.alpha * (0.6 + Math.sin(frameCount*0.02+s.x)*0.4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.round(s.x), Math.round(s.y), s.r, s.r);
  });
  ctx.globalAlpha = 1;
}

// ── HUD ──
function drawHUD() {
  // Score
  ctx.fillStyle = COL.accent;
  ctx.font = '12px "Press Start 2P"';
  ctx.fillText('SCORE', 20, 32);
  ctx.fillStyle = COL.text;
  ctx.font = '14px "Press Start 2P"';
  ctx.fillText(String(Math.floor(score)).padStart(6,'0'), 20, 52);

  // High score
  ctx.fillStyle = COL.stardust;
  ctx.font = '10px "Press Start 2P"';
  ctx.fillText('BEST', W/2 - 40, 32);
  ctx.fillStyle = COL.text;
  ctx.font = '12px "Press Start 2P"';
  ctx.fillText(String(Math.floor(highScore)).padStart(6,'0'), W/2 - 48, 50);

  // Speed
  ctx.fillStyle = COL.muted;
  ctx.font = '9px "Press Start 2P"';
  ctx.fillText('SPD x' + speed.toFixed(1), W - 140, 32);

  // Controls hint (only early game)
  if (score < 50) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = COL.text;
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('CLICK / SPACE TO JUMP', W/2 - 108, H - 10);
    ctx.globalAlpha = 1;
  }
}

// ── Screens ──
function drawStartScreen() {
  ctx.fillStyle = 'rgba(7,7,20,0.85)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = COL.player;
  ctx.font = '28px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('STARFALL', W/2, H/2 - 70);
  ctx.fillStyle = COL.accent;
  ctx.fillText('RUNNER', W/2, H/2 - 36);

  // Subtitle
  ctx.fillStyle = COL.muted;
  ctx.font = '9px "Press Start 2P"';
  ctx.fillText('dodge asteroids · collect stardust', W/2, H/2 + 4);

  // Blinking prompt
  if (Math.floor(Date.now()/500) % 2 === 0) {
    ctx.fillStyle = COL.stardust;
    ctx.font = '11px "Press Start 2P"';
    ctx.fillText('CLICK TO START', W/2, H/2 + 50);
  }

  // Double jump hint
  ctx.fillStyle = COL.muted;
  ctx.font = '8px "Press Start 2P"';
  ctx.fillText('double jump available!', W/2, H/2 + 76);

  ctx.textAlign = 'left';
}

function drawDeadScreen() {
  ctx.fillStyle = 'rgba(7,7,20,0.88)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  ctx.fillStyle = COL.danger;
  ctx.font = '22px "Press Start 2P"';
  ctx.fillText('GAME OVER', W/2, H/2 - 70);

  ctx.fillStyle = COL.muted;
  ctx.font = '9px "Press Start 2P"';
  ctx.fillText('SCORE', W/2, H/2 - 28);
  ctx.fillStyle = COL.text;
  ctx.font = '20px "Press Start 2P"';
  ctx.fillText(String(Math.floor(score)).padStart(6,'0'), W/2, H/2 - 4);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = COL.stardust;
    ctx.font = '10px "Press Start 2P"';
    ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H/2 + 24);
  } else {
    ctx.fillStyle = COL.muted;
    ctx.font = '9px "Press Start 2P"';
    ctx.fillText('BEST: ' + String(Math.floor(highScore)).padStart(6,'0'), W/2, H/2 + 24);
  }

  if (Math.floor(Date.now()/500) % 2 === 0) {
    ctx.fillStyle = COL.accent;
    ctx.font = '11px "Press Start 2P"';
    ctx.fillText('CLICK TO RETRY', W/2, H/2 + 62);
  }

  ctx.textAlign = 'left';
}

// ── Collision ──
function rectsOverlap(ax,ay,aw,ah, bx,by,bw,bh, margin=6) {
  return ax+margin < bx+bw-margin &&
         ax+aw-margin > bx+margin &&
         ay+margin < by+bh-margin &&
         ay+ah-margin > by+margin;
}

// ── Main loop ──
function update(dt) {
  if (state !== 'playing') return;

  frameCount++;
  score += dt * 0.03 * speed;

  // Speed ramp (every 200 pts, up to x6)
  speed = Math.min(3 + Math.floor(score / 200) * 0.5, 6);

  // Scroll bg stars
  bgStars.forEach(s => {
    s.x -= s.speed * (speed * 0.4);
    if (s.x < 0) { s.x = W; s.y = Math.random()*(H-80); }
  });

  // Scroll ground stars
  stars.forEach(s => {
    s.x -= speed * 1.2;
    if (s.x < -10) { s.x = W + Math.random()*100; s.y = GROUND_Y + Math.random()*40; }
  });

  // Player physics
  if (!player.onGround) {
    player.vy += 0.6; // gravity
    player.y += player.vy;
  }

  if (player.y >= GROUND_Y - player.h) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.onGround = true;
    player.jumpCount = 0;
    player.jumping = false;
  }

  // Trail
  player.trail.push({ x: player.x, y: player.y + player.h/2, life: 1 });
  if (player.trail.length > 12) player.trail.shift();
  player.trail.forEach(t => t.life -= 0.08);

  // Dust on ground
  if (player.onGround && frameCount % 4 === 0) spawnDust();

  // Spawn asteroids
  const spawnRate = Math.max(55 - Math.floor(speed)*6, 28);
  if (frameCount % spawnRate === 0) spawnAsteroid();

  // Update asteroids
  asteroids.forEach(a => {
    a.x -= speed * 1.05;
    a.spin += a.spinSpeed;
    a.wobble += 0.04;
  });
  asteroids = asteroids.filter(a => a.x > -60);

  // Collision
  if (player.invincible <= 0) {
    for (const a of asteroids) {
      if (rectsOverlap(player.x, player.y, player.w, player.h, a.x, a.y, a.w, a.h)) {
        spawnExplosion(player.x + player.w/2, player.y + player.h/2);
        highScore = Math.max(highScore, Math.floor(score));
        state = 'dead';
        return;
      }
    }
  }

  // Update particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    p.vx *= 0.95; p.vy *= 0.95;
  });
  particles = particles.filter(p => p.life > 0);

  dustParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
  });
  dustParticles = dustParticles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  drawBg();
  drawGround();

  if (state === 'playing' || state === 'dead') {

    // Trail
    player.trail.forEach((t, i) => {
      ctx.globalAlpha = t.life * 0.25;
      ctx.fillStyle = COL.player;
      const sz = 4 + i * 1.5;
      ctx.fillRect(Math.round(t.x - sz/2), Math.round(t.y - sz/2), sz, sz);
    });
    ctx.globalAlpha = 1;

    // Dust
    dustParticles.forEach(p => {
      ctx.globalAlpha = p.life * 0.6;
      ctx.fillStyle = COL.accent;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.r, p.r);
    });
    ctx.globalAlpha = 1;

    // Player
    const blinkOk = player.invincible <= 0 || Math.floor(frameCount/4)%2===0;
    if (blinkOk) {
      drawShip(player.x, player.y, player.w, player.h);
    }

    // Asteroids
    asteroids.forEach(drawAsteroid);

    // Particles
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x - p.r/2), Math.round(p.y - p.r/2), p.r, p.r);
    });
    ctx.globalAlpha = 1;

    drawHUD();
  }

  if (state === 'start') { drawBg(); drawGround(); drawStartScreen(); }
  if (state === 'dead')  { drawDeadScreen(); }
}

function loop(ts) {
  const dt = Math.min(ts - lastTime, 32);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Boot
state = 'start';
highScore = 0;
bgStars = Array.from({length: 80}, () => ({
  x: Math.random() * W,
  y: Math.random() * (H - 80),
  r: Math.random() < 0.3 ? 2 : 1,
  speed: 0.3 + Math.random() * 0.8,
  alpha: 0.2 + Math.random() * 0.8,
}));
stars = [];
particles = [];
dustParticles = [];
asteroids = [];
player = { x:120, y: H-80-24, w:28, h:24, vy:0, onGround:true, jumping:false, jumpCount:0, maxJumps:2, frame:0, frameTimer:0, trail:[], invincible:0 };
frameCount = 0;
score = 0;
speed = 3;

requestAnimationFrame(loop);
</script>
</body>
</html>
