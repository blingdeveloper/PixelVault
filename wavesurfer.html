<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌊 Sunny Surf!</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(160deg, #FFE8F4 0%, #EEF0FF 50%, #E0F4FF 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Baloo 2', cursive;
      overflow: hidden;
    }
    #game-wrap {
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 12px 60px rgba(180,140,220,0.22),
        0 2px 0 rgba(255,255,255,0.9) inset;
      border: 3px solid rgba(255,255,255,0.85);
    }
    canvas { display: block; image-rendering: pixelated; }
    #back-btn {
      margin-top: .9rem;
      font-family: 'Baloo 2', cursive;
      font-size: 13px;
      font-weight: 700;
      padding: .4rem 1.2rem;
      background: rgba(255,255,255,0.7);
      color: #B088C8;
      border: 2px solid rgba(180,140,210,0.35);
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: all .2s;
    }
    #back-btn:hover {
      background: rgba(255,255,255,0.95);
      color: #8858A8;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(180,140,220,0.25);
    }
  </style>
</head>
<body>
<div id="game-wrap">
  <canvas id="canvas" width="720" height="480"></canvas>
</div>
<a href="index.html" id="back-btn">← Back to PixelVault</a>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 720, H = 480;

// ── Pastel palette ──
const C = {
  // Sky
  skyTop:   '#C8D8FF',
  skyMid:   '#E0CCFF',
  skyHorz:  '#FFD8EE',
  // Ocean
  ocean1:   '#7EC8E8',
  ocean2:   '#5AB0D8',
  ocean3:   '#A8E4F8',
  waveLine: '#90D8F0',
  waveDeep: '#68B8D8',
  waveCrest:'#FFFFFF',
  foam:     '#E8F8FF',
  // Characters
  surfer:   '#FFD8B0',
  suit:     '#FF90C0',
  suitDark: '#D86898',
  board:    '#FFB830',
  boardBot: '#FF8C10',
  hair:     '#5A3010',
  // Obstacles
  rock:     '#C0A890',
  rockTop:  '#D8C8B0',
  rockDark: '#A09080',
  sharkBody:'#B0C8D8',
  sharkFin: '#90B0C8',
  sharkBell:'#D8E8F0',
  rivalSuit:'#A088FF',
  rivalBd:  '#FF88B0',
  // UI
  pink:     '#FF90C0',
  purple:   '#C098F0',
  peach:    '#FFB898',
  mint:     '#90E8C8',
  lemon:    '#FFE898',
  white:    '#FFFFFF',
  cream:    '#FFF8F0',
  softText: '#886880',
  // Effects
  sparkA:   '#FFD84B',
  sparkB:   '#FF90C0',
  sparkC:   '#90E8C8',
};

// ── Auto trick names (kawaii themed) ──
const TRICKS = [
  { name: '✨ TWINKLE FLIP', score: 120 },
  { name: '🌸 PETAL SPIN',   score: 140 },
  { name: '🍬 CANDY GRAB',   score: 130 },
  { name: '🌈 RAINBOW ARC',  score: 160 },
  { name: '⭐ STAR JUMP',    score: 150 },
  { name: '🎀 RIBBON TWIST', score: 170 },
  { name: '🍡 DANGO ROLL',   score: 180 },
];

// ── State ──
let state = 'start';
let score, highScore = 0, combo, comboTimer;
let speed, frameCount, distance;
let surfer, obstacles, particles, floatTexts, waveCrests, clouds;
let keys = {}, wipeTimer = 0, waveOffset = 0;
let lanePositions;
let bgBubbles = [];

const LANE_COUNT = 5;
function getLanes() {
  return Array.from({length: LANE_COUNT}, (_, i) => 110 + i * (W - 220) / (LANE_COUNT - 1));
}

// ── Init ──
function init() {
  score = 0; combo = 0; comboTimer = 0;
  speed = 2.8; frameCount = 0; distance = 0;
  wipeTimer = 0; waveOffset = 0;
  obstacles = []; particles = []; floatTexts = []; waveCrests = [];
  lanePositions = getLanes();

  surfer = {
    lane: 2, x: lanePositions[2], y: H - 115,
    vy: 0, airborne: false, airHeight: 0,
    rotation: 0, trickAnim: 0, trickName: '',
    leanDir: 0, moveCooldown: 0, jumpCooldown: 0,
    bounceAnim: 0,
  };

  // Fluffy clouds
  clouds = Array.from({length: 7}, (_, i) => ({
    x: (i / 7) * W + Math.random() * 80,
    y: 20 + Math.random() * 80,
    w: 70 + Math.random() * 90,
    h: 22 + Math.random() * 18,
    spd: 0.15 + Math.random() * 0.25,
    fluff: Math.random() < 0.5,
  }));

  // Background bubbles
  bgBubbles = Array.from({length: 12}, () => ({
    x: Math.random() * W,
    y: H * 0.45 + Math.random() * H * 0.55,
    r: 4 + Math.random() * 10,
    spd: 0.2 + Math.random() * 0.4,
    a: 0.08 + Math.random() * 0.15,
  }));

  for (let i = 0; i < 4; i++) spawnWaveCrest(i * 200);
}

// ── Input ──
document.addEventListener('keydown', e => {
  if (keys[e.code]) return;
  keys[e.code] = true;
  if (state === 'start')    { state = 'playing'; init(); return; }
  if (state === 'gameover') { state = 'playing'; init(); return; }
  if (state === 'wiping')   return;
  if (e.code === 'ArrowLeft')  tryMoveLane(-1);
  if (e.code === 'ArrowRight') tryMoveLane(1);
  if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); tryJump(); }
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function tryMoveLane(dir) {
  if (surfer.moveCooldown > 0) return;
  const n = surfer.lane + dir;
  if (n < 0 || n >= LANE_COUNT) return;
  surfer.lane = n; surfer.leanDir = dir; surfer.moveCooldown = 14;
  setTimeout(() => { surfer.leanDir = 0; }, 200);
}

function tryJump() {
  if (surfer.airborne || surfer.jumpCooldown > 0) return;
  const onCrest = waveCrests.some(wc => Math.abs(wc.x - surfer.x) < 60 && wc.life > 0.25);
  surfer.vy = onCrest ? -11 : -8;
  surfer.airborne = true; surfer.jumpCooldown = 45;
  state = 'airborne';
  spawnSpray(surfer.x, surfer.y);
  // Auto-trick!
  autoTrick();
}

function autoTrick() {
  const trick = TRICKS[Math.floor(Math.random() * TRICKS.length)];
  surfer.trickName = trick.name; surfer.trickAnim = 28;
  surfer.rotation += Math.PI * (Math.random() < 0.5 ? 1.5 : -1.5);
  const pts = trick.score * Math.max(1, combo);
  score += pts; combo++; comboTimer = 200;
  floatTexts.push({
    x: surfer.x, y: surfer.y - 50 - surfer.airHeight,
    text: trick.name, sub: '+' + pts,
    color: C.pink, life: 1, vy: -0.7,
  });
  spawnTrickParticles(surfer.x, surfer.y);
}

// ── Spawning ──
function spawnObstacle() {
  const roll = Math.random();
  const lane = Math.floor(Math.random() * LANE_COUNT);
  let type;
  if (distance < 1000)      type = 'rock';
  else if (distance < 2500) type = roll < 0.55 ? 'rock' : 'shark';
  else                      type = roll < 0.4  ? 'rock' : roll < 0.7 ? 'shark' : 'rival';
  obstacles.push({ type, lane, x: lanePositions[lane], z: 0, active: true });
}

function spawnWaveCrest(zOff = 0) {
  waveCrests.push({
    x: lanePositions[Math.floor(Math.random() * LANE_COUNT)],
    z: zOff, life: 1, size: 32 + Math.random() * 24,
  });
}

// ── Particles ──
function spawnSpray(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
    const spd = 1.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life:1, decay:0.07, r:2+Math.random()*4, color:C.waveCrest });
  }
}

function spawnTrickParticles(x, y) {
  const cols = [C.sparkA, C.sparkB, C.sparkC, C.purple, C.mint];
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, spd = 1.5 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life:1, decay:0.03+Math.random()*0.03, r:3+Math.random()*5,
      color: cols[Math.floor(Math.random()*cols.length)] });
  }
}

function spawnWipeParticles(x, y) {
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2, spd = 1 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life:1, decay:0.025+Math.random()*0.03, r:3+Math.random()*7, color:C.foam });
  }
}

// ── Update ──
function update() {
  if (state !== 'playing' && state !== 'airborne' && state !== 'wiping') return;
  frameCount++; waveOffset += 0.04; distance += speed;

  // Very gentle speed ramp
  speed = Math.min(2.8 + distance * 0.0005, 6);

  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) combo = 0; }
  if (surfer.moveCooldown > 0) surfer.moveCooldown--;
  if (surfer.jumpCooldown > 0) surfer.jumpCooldown--;
  if (surfer.bounceAnim > 0) surfer.bounceAnim--;

  surfer.x += (lanePositions[surfer.lane] - surfer.x) * 0.16;

  if (surfer.airborne) {
    surfer.vy += 0.5;
    surfer.airHeight -= surfer.vy;
    surfer.airHeight = Math.max(0, surfer.airHeight);
    if (surfer.airHeight <= 0 && surfer.vy > 0) {
      surfer.airborne = false; surfer.vy = 0; surfer.airHeight = 0;
      state = 'playing'; surfer.rotation = 0; surfer.bounceAnim = 10;
      spawnSpray(surfer.x, surfer.y);
    }
  }
  if (surfer.trickAnim > 0) surfer.trickAnim--;

  if (state === 'wiping') {
    wipeTimer--;
    if (wipeTimer <= 0) { highScore = Math.max(highScore, score); state = 'gameover'; }
    return;
  }

  score += Math.floor(speed * 0.08);

  // Fewer obstacles — longer spawn interval
  const spawnInt = Math.max(90, 180 - Math.floor(distance / 300) * 8);
  if (frameCount % spawnInt === 0) spawnObstacle();
  if (frameCount % 90 === 0) spawnWaveCrest();

  // Clouds drift
  clouds.forEach(cl => { cl.x -= cl.spd; if (cl.x + cl.w < 0) cl.x = W + 20; });

  // Bubbles drift up
  bgBubbles.forEach(b => { b.y -= b.spd; if (b.y < H * 0.45) b.y = H; });

  obstacles.forEach(ob => { ob.z += speed * 0.0035; });

  // More forgiving hit window (0.88 instead of 0.85, narrower z range)
  obstacles.forEach(ob => {
    if (!ob.active) return;
    if (ob.z > 0.88 && ob.z < 1.05 && ob.lane === surfer.lane) {
      if (!surfer.airborne) {
        ob.active = false; wipeout();
      } else {
        ob.active = false;
        const pts = 80 * Math.max(1, combo);
        score += pts; combo++; comboTimer = 200;
        floatTexts.push({ x: surfer.x, y: surfer.y - 90, text: '🌟 DODGE!', sub: '+' + pts, color: C.mint, life: 1, vy: -0.8 });
      }
    }
  });
  obstacles = obstacles.filter(ob => ob.z < 1.3);

  waveCrests.forEach(wc => { wc.z += speed * 0.0045; wc.life -= 0.007; });
  waveCrests = waveCrests.filter(wc => wc.life > 0 && wc.z < 1.2);

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.94; p.life -= p.decay; });
  particles = particles.filter(p => p.life > 0);
  floatTexts.forEach(f => { f.y += f.vy; f.life -= 0.016; });
  floatTexts = floatTexts.filter(f => f.life > 0);
}

function wipeout() {
  state = 'wiping'; wipeTimer = 120;
  spawnWipeParticles(surfer.x, surfer.y);
  surfer.rotation = Math.PI * 4; combo = 0; comboTimer = 0;
}

// ── Draw ──
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawSky(); drawClouds(); drawOcean(); drawBubbles();
  drawWaveCrests();
  if (state !== 'start' && state !== 'gameover') { drawObstacles(); drawSurfer(); }
  drawParticles(); drawHUD(); drawFloatTexts();
  if (state === 'start')    drawStartScreen();
  if (state === 'gameover') drawGameOverScreen();
  if (state === 'wiping')   drawWipeScreen();
}

function drawSky() {
  const horizonY = H * 0.44;
  const grd = ctx.createLinearGradient(0, 0, 0, horizonY);
  grd.addColorStop(0,   C.skyTop);
  grd.addColorStop(0.6, C.skyMid);
  grd.addColorStop(1,   C.skyHorz);
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, horizonY);

  // Soft sun
  const sx = W * 0.72, sy = H * 0.14;
  const sunGrd = ctx.createRadialGradient(sx, sy, 4, sx, sy, 55);
  sunGrd.addColorStop(0, 'rgba(255,255,200,0.9)');
  sunGrd.addColorStop(0.4, 'rgba(255,230,150,0.4)');
  sunGrd.addColorStop(1, 'transparent');
  ctx.fillStyle = sunGrd; ctx.fillRect(sx-55, sy-55, 110, 110);
  ctx.fillStyle = '#FFFACC'; ctx.fillRect(sx-10, sy-10, 20, 20);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(sx-6, sy-6, 12, 12);
}

function drawClouds() {
  clouds.forEach(cl => {
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    // Main puff
    ctx.fillRect(Math.round(cl.x), Math.round(cl.y), cl.w, cl.h);
    // Top puffs
    ctx.fillRect(Math.round(cl.x + cl.w*0.1), Math.round(cl.y - cl.h*0.5), cl.w*0.4, cl.h*0.7);
    ctx.fillRect(Math.round(cl.x + cl.w*0.45), Math.round(cl.y - cl.h*0.35), cl.w*0.35, cl.h*0.55);
    if (cl.fluff) ctx.fillRect(Math.round(cl.x + cl.w*0.65), Math.round(cl.y - cl.h*0.2), cl.w*0.25, cl.h*0.45);
    // Pink tint underside
    ctx.fillStyle = 'rgba(255,200,220,0.25)';
    ctx.fillRect(Math.round(cl.x+4), Math.round(cl.y+cl.h*0.6), cl.w-8, cl.h*0.35);
  });
}

function drawOcean() {
  const horizonY = H * 0.44;

  // Ocean gradient
  const ogrd = ctx.createLinearGradient(0, horizonY, 0, H);
  ogrd.addColorStop(0,   '#9ADCF0');
  ogrd.addColorStop(0.4, '#7ACCE8');
  ogrd.addColorStop(1,   '#5AB8D8');
  ctx.fillStyle = ogrd; ctx.fillRect(0, horizonY, W, H - horizonY);

  // Perspective wave lines — soft and rounded
  const vanishX = W / 2, vanishY = horizonY;
  const numH = 16;
  for (let i = 0; i < numH; i++) {
    const t = ((i / numH) + (waveOffset * 0.035)) % 1;
    const screenY = vanishY + (H - vanishY) * (t * t);
    const spread = t * W * 0.95;
    const wShift = Math.sin(waveOffset * 1.1 + t * 3.5) * 10 * t;
    const isBright = i % 3 === 0;
    ctx.strokeStyle = isBright ? C.waveCrest : C.waveLine;
    ctx.globalAlpha = isBright ? 0.45 + t * 0.35 : 0.18 + t * 0.2;
    ctx.lineWidth = isBright ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(vanishX - spread/2 + wShift, screenY);
    ctx.lineTo(vanishX + spread/2 + wShift, screenY);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Soft foam strips at bottom
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  for (let i = 0; i < 5; i++) {
    const fy = H - 18 - i * 14;
    const fw = 50 + Math.sin(waveOffset + i * 1.9) * 25;
    ctx.fillRect(Math.sin(waveOffset * 0.9 + i * 1.4) * 70 + W * 0.22, fy, fw, 5);
    ctx.fillRect(Math.sin(waveOffset * 0.7 + i * 2.0) * 90 + W * 0.55, fy + 2, fw * 0.7, 4);
  }
}

function drawBubbles() {
  bgBubbles.forEach(b => {
    ctx.globalAlpha = b.a;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawWaveCrests() {
  waveCrests.forEach(wc => {
    const t = wc.z; if (t < 0 || t > 1) return;
    const screenY = H * 0.44 + (H - H * 0.44) * (t * t);
    const scale = t * t * 1.1;
    const sx = W / 2 + (wc.x - W / 2) * (0.1 + t * 0.9);

    // Soft white crest with pink hint
    ctx.globalAlpha = wc.life * (0.5 + t * 0.4);
    ctx.fillStyle = C.waveCrest;
    ctx.fillRect(Math.round(sx-wc.size*scale/2), Math.round(screenY-4*scale), Math.round(wc.size*scale), Math.round(6*scale));
    ctx.fillStyle = 'rgba(255,180,210,0.5)';
    ctx.fillRect(Math.round(sx-wc.size*scale*0.4), Math.round(screenY-3*scale), Math.round(wc.size*scale*0.8), Math.round(3*scale));
    ctx.globalAlpha = 1;
  });
}

function drawObstacles() {
  obstacles.forEach(ob => {
    if (!ob.active) return;
    const t = ob.z; if (t < 0.05 || t > 1.15) return;
    const screenY = H * 0.44 + (H - H * 0.44) * (t * t);
    const scale = Math.max(0.05, t * t);
    const sx = W / 2 + (ob.x - W / 2) * (0.1 + t * 0.9);

    ctx.save();
    ctx.translate(Math.round(sx), Math.round(screenY));
    ctx.scale(scale, scale);

    if (ob.type === 'rock') {
      // Rounded pastel rock
      ctx.fillStyle = C.rockDark;
      ctx.fillRect(-19, -9, 38, 20);
      ctx.fillRect(-13, -17, 26, 10);
      ctx.fillRect(-7, -23, 14, 8);
      ctx.fillStyle = C.rock;
      ctx.fillRect(-17, -7, 34, 16);
      ctx.fillRect(-11, -15, 22, 8);
      ctx.fillStyle = C.rockTop;
      ctx.fillRect(-9, -17, 18, 6);
      // Cute face!
      ctx.fillStyle = '#8A7060';
      ctx.fillRect(-6, -8, 4, 4);
      ctx.fillRect(2, -8, 4, 4);
      ctx.fillRect(-4, -2, 8, 2);

    } else if (ob.type === 'shark') {
      // Cute pastel shark
      ctx.fillStyle = C.sharkBell;
      ctx.fillRect(-10, -2, 20, 12);
      ctx.fillStyle = C.sharkBody;
      ctx.fillRect(-10, -18, 20, 16);
      ctx.fillStyle = C.sharkFin;
      ctx.fillRect(-5, -30, 10, 16);
      ctx.fillRect(-4, -28, 8, 12);
      // Cute eyes
      ctx.fillStyle = '#2a3a50';
      ctx.fillRect(-5, -12, 4, 4);
      ctx.fillRect(1, -12, 4, 4);
      // Blush
      ctx.fillStyle = 'rgba(255,160,180,0.5)';
      ctx.fillRect(-8, -8, 5, 3);
      ctx.fillRect(3, -8, 5, 3);
      // Smile
      ctx.fillStyle = '#2a3a50';
      ctx.fillRect(-3, -5, 6, 2);

    } else if (ob.type === 'rival') {
      // Rival surfer — cute chibi style
      ctx.fillStyle = C.rivalBd;
      ctx.fillRect(-16, 7, 32, 5);
      ctx.fillStyle = '#FF60A0';
      ctx.fillRect(-16, 7, 32, 2);
      // Body
      ctx.fillStyle = C.rivalSuit;
      ctx.fillRect(-6, -16, 12, 22);
      // Head
      ctx.fillStyle = '#FFD8B0';
      ctx.fillRect(-7, -28, 14, 14);
      // Hair
      ctx.fillStyle = '#FF80B0';
      ctx.fillRect(-7, -30, 14, 8);
      ctx.fillRect(-9, -28, 3, 6);
      // Eyes
      ctx.fillStyle = '#503040';
      ctx.fillRect(-4, -22, 3, 3);
      ctx.fillRect(1, -22, 3, 3);
      // Arms
      ctx.fillStyle = C.rivalSuit;
      ctx.fillRect(-14, -12, 8, 3);
      ctx.fillRect(6, -12, 8, 3);
    }
    ctx.restore();
  });
}

function drawSurfer() {
  if (state === 'wiping') {
    ctx.save();
    ctx.translate(Math.round(surfer.x), Math.round(surfer.y - 20));
    const wp = 1 - wipeTimer / 120;
    ctx.rotate(surfer.rotation * wp);
    ctx.globalAlpha = Math.max(0, 1 - wp * 1.6);
    drawSurferPixels(surfer.leanDir);
    ctx.restore();
    return;
  }

  const bounce = surfer.bounceAnim > 0 ? Math.sin(surfer.bounceAnim * 0.5) * 4 : 0;
  const sy = surfer.y - surfer.airHeight + bounce;

  ctx.save();
  ctx.translate(Math.round(surfer.x), Math.round(sy));

  // Shadow
  if (surfer.airborne && surfer.airHeight > 5) {
    ctx.globalAlpha = Math.max(0.05, 0.3 - surfer.airHeight * 0.003);
    ctx.fillStyle = 'rgba(100,180,220,0.4)';
    ctx.fillRect(-14, surfer.airHeight - 4, 28, 5);
    ctx.globalAlpha = 1;
  }

  if (surfer.airborne && surfer.trickAnim > 0) {
    ctx.rotate(surfer.rotation * 0.06);
  }

  drawSurferPixels(surfer.leanDir);
  ctx.restore();

  // Soft spray trail
  if (!surfer.airborne && frameCount % 6 === 0) {
    const col = [C.waveCrest, 'rgba(255,200,230,0.8)', 'rgba(200,240,255,0.8)'][Math.floor(Math.random()*3)];
    particles.push({
      x: surfer.x + (Math.random()-0.5)*10, y: surfer.y + 8,
      vx: (Math.random()-0.5)*1.0, vy: -(Math.random()*1.0),
      life:1, decay:0.13, r:1+Math.random()*3, color:col,
    });
  }
}

function drawSurferPixels(lean) {
  const lx = lean * 4;

  // Board glow
  ctx.fillStyle = 'rgba(255,184,48,0.3)';
  ctx.fillRect(-18+lx, 6, 36, 12);

  // Board
  ctx.fillStyle = C.boardBot;
  ctx.fillRect(-16+lx, 8, 32, 7);
  ctx.fillStyle = C.board;
  ctx.fillRect(-16+lx, 8, 32, 5);
  // Board stripe
  ctx.fillStyle = '#FFD060';
  ctx.fillRect(-10+lx, 9, 20, 2);

  // Legs
  ctx.fillStyle = '#FFB8D0';
  ctx.fillRect(-6+lx, 0, 5, 8);
  ctx.fillRect(1+lx, 0, 5, 8);

  // Body — pink wetsuit
  ctx.fillStyle = C.suit;
  ctx.fillRect(-7+lx, -16, 14, 18);
  ctx.fillStyle = C.suitDark;
  ctx.fillRect(-7+lx, -16, 3, 18); // side stripe
  ctx.fillRect(4+lx, -16, 3, 18);

  // Arms out
  ctx.fillStyle = C.suit;
  ctx.fillRect(-14+lx, -12, 7, 4);
  ctx.fillRect(7+lx, -12, 7, 4);

  // Head
  ctx.fillStyle = '#FFD8B0';
  ctx.fillRect(-6+lx, -28, 12, 14);

  // Hair — cute bob
  ctx.fillStyle = C.hair;
  ctx.fillRect(-7+lx, -32, 14, 8);
  ctx.fillRect(-8+lx, -28, 3, 6);
  ctx.fillRect(5+lx, -28, 3, 5);

  // Face — cute eyes and blush
  ctx.fillStyle = '#503040';
  ctx.fillRect(-4+lx, -24, 3, 3);
  ctx.fillRect(1+lx, -24, 3, 3);
  // Blush
  ctx.fillStyle = 'rgba(255,160,180,0.6)';
  ctx.fillRect(-6+lx, -21, 4, 2);
  ctx.fillRect(2+lx, -21, 4, 2);
  // Smile
  ctx.fillStyle = '#503040';
  ctx.fillRect(-2+lx, -19, 4, 2);

  // Scrunchie / hair detail
  ctx.fillStyle = C.pink;
  ctx.fillRect(-7+lx, -32, 6, 3);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x-p.r/2), Math.round(p.y-p.r/2), Math.round(p.r), Math.round(p.r));
  });
  ctx.globalAlpha = 1;
}

function drawHUD() {
  if (state === 'start' || state === 'gameover') return;

  // Soft pill score background
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.roundRect(10, 10, 160, 40, 20);
  ctx.fill();

  ctx.fillStyle = C.purple;
  ctx.font = 'bold 16px "Baloo 2"';
  ctx.textAlign = 'left';
  ctx.fillText('✨ ' + String(score).padStart(6, '0'), 22, 36);

  // Best score
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.roundRect(10, 54, 145, 26, 14);
  ctx.fill();
  ctx.fillStyle = 'rgba(160,120,180,0.8)';
  ctx.font = 'bold 11px "Baloo 2"';
  ctx.fillText('BEST  ' + String(highScore).padStart(6, '0'), 20, 72);

  // Speed
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.roundRect(W - 110, 10, 100, 30, 15);
  ctx.fill();
  ctx.fillStyle = C.mint;
  ctx.font = 'bold 11px "Baloo 2"';
  ctx.textAlign = 'right';
  ctx.fillText('🌊 x' + speed.toFixed(1), W - 16, 30);

  // Combo
  if (combo > 1) {
    const pulse = 0.85 + Math.sin(frameCount * 0.15) * 0.15;
    ctx.save();
    ctx.globalAlpha = comboTimer > 40 ? pulse : comboTimer / 40 * pulse;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath();
    ctx.roundRect(W/2 - 90, 8, 180, 36, 18);
    ctx.fill();
    ctx.fillStyle = C.pink;
    ctx.font = 'bold 16px "Baloo 2"';
    ctx.textAlign = 'center';
    ctx.fillText('🎀 ' + combo + 'x COMBO!', W/2, 32);
    // Combo bar
    ctx.fillStyle = 'rgba(255,150,190,0.25)';
    ctx.beginPath(); ctx.roundRect(W/2-80, 46, 160, 6, 3); ctx.fill();
    ctx.fillStyle = C.pink;
    ctx.beginPath(); ctx.roundRect(W/2-80, 46, 160*(comboTimer/200), 6, 3); ctx.fill();
    ctx.restore();
  }

  // Controls hint
  if (distance < 600) {
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.roundRect(W/2-160, H-34, 320, 22, 11); ctx.fill();
    ctx.fillStyle = C.softText;
    ctx.font = 'bold 10px "Baloo 2"';
    ctx.textAlign = 'center';
    ctx.fillText('← → to steer  •  ↑ to jump (auto-trick!)', W/2, H-19);
    ctx.globalAlpha = 1;
  }

  // Lane dots — cute
  lanePositions.forEach((lx, i) => {
    ctx.fillStyle = i === surfer.lane ? C.pink : 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(Math.round(lx), H - 14, i === surfer.lane ? 5 : 3.5, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.textAlign = 'left';
}

function drawFloatTexts() {
  floatTexts.forEach(f => {
    ctx.save();
    ctx.globalAlpha = f.life;
    // Pill background
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const tw = ctx.measureText(f.text).width + 16;
    ctx.beginPath(); ctx.roundRect(Math.round(f.x) - tw/2, Math.round(f.y) - 16, tw, 20, 10); ctx.fill();
    ctx.fillStyle = f.color;
    ctx.font = 'bold 11px "Baloo 2"';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, Math.round(f.x), Math.round(f.y));
    if (f.sub) {
      ctx.fillStyle = C.softText;
      ctx.font = 'bold 10px "Baloo 2"';
      ctx.fillText(f.sub, Math.round(f.x), Math.round(f.y) + 14);
    }
    ctx.restore();
  });
  ctx.textAlign = 'left';
}

function drawStartScreen() {
  // Soft overlay
  ctx.fillStyle = 'rgba(200,220,255,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  // Title card
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.beginPath(); ctx.roundRect(W/2-200, H/2-120, 400, 250, 28); ctx.fill();
  ctx.strokeStyle = 'rgba(255,160,200,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(W/2-200, H/2-120, 400, 250, 28); ctx.stroke();

  ctx.fillStyle = C.pink;
  ctx.font = 'bold 36px "Baloo 2"';
  ctx.fillText('🌊 Sunny Surf!', W/2, H/2 - 72);

  ctx.fillStyle = C.purple;
  ctx.font = 'bold 12px "Baloo 2"';
  ctx.fillText('ride the waves · auto-tricks · dodge obstacles', W/2, H/2 - 44);

  ctx.fillStyle = C.softText;
  ctx.font = 'bold 12px "Baloo 2"';
  ctx.fillText('← →   steer between lanes', W/2, H/2 - 10);
  ctx.fillText('↑ or W   jump (tricks happen automatically! ✨)', W/2, H/2 + 12);
  ctx.fillText('dodge 🪨 rocks  •  🦈 sharks  •  🏄 rivals', W/2, H/2 + 34);

  // Blinking button
  if (Math.floor(Date.now() / 500) % 2 === 0) {
    ctx.fillStyle = C.pink;
    ctx.beginPath(); ctx.roundRect(W/2-90, H/2+58, 180, 40, 20); ctx.fill();
    ctx.fillStyle = C.white;
    ctx.font = 'bold 14px "Baloo 2"';
    ctx.fillText('Press any key! 🎀', W/2, H/2+84);
  }
  ctx.textAlign = 'left';
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(200,220,255,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.roundRect(W/2-180, H/2-110, 360, 230, 28); ctx.fill();
  ctx.strokeStyle = 'rgba(255,160,200,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(W/2-180, H/2-110, 360, 230, 28); ctx.stroke();

  ctx.fillStyle = C.purple;
  ctx.font = 'bold 28px "Baloo 2"';
  ctx.fillText('🌊 Wipeout!', W/2, H/2 - 62);

  ctx.fillStyle = C.pink;
  ctx.font = 'bold 22px "Baloo 2"';
  ctx.fillText(String(score).padStart(6,'0') + ' pts', W/2, H/2 - 24);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = C.lemon;
    ctx.fillStyle = '#E0A020';
    ctx.font = 'bold 13px "Baloo 2"';
    ctx.fillText('⭐ New High Score! ⭐', W/2, H/2 + 6);
  } else {
    ctx.fillStyle = C.softText;
    ctx.font = 'bold 12px "Baloo 2"';
    ctx.fillText('Best: ' + String(highScore).padStart(6,'0') + ' pts', W/2, H/2 + 6);
  }

  if (Math.floor(Date.now() / 500) % 2 === 0) {
    ctx.fillStyle = C.pink;
    ctx.beginPath(); ctx.roundRect(W/2-85, H/2+38, 170, 38, 19); ctx.fill();
    ctx.fillStyle = C.white;
    ctx.font = 'bold 13px "Baloo 2"';
    ctx.fillText('Try again! 🌸', W/2, H/2+63);
  }
  ctx.textAlign = 'left';
}

function drawWipeScreen() {
  if (wipeTimer < 95) {
    const prog = (95 - wipeTimer) / 95;
    ctx.fillStyle = `rgba(200,220,255,${prog * 0.65})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = prog;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.roundRect(W/2-110, H/2-30, 220, 52, 26); ctx.fill();
    ctx.fillStyle = C.purple;
    ctx.font = 'bold 20px "Baloo 2"';
    ctx.fillText('🌊 Wipeout~!', W/2, H/2+8);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// Boot
lanePositions = getLanes();
waveCrests=[]; obstacles=[]; particles=[]; floatTexts=[]; clouds=[]; bgBubbles=[];
surfer={lane:2,x:lanePositions[2],y:H-115,vy:0,airborne:false,airHeight:0,
  rotation:0,trickAnim:0,trickName:'',leanDir:0,moveCooldown:0,jumpCooldown:0,bounceAnim:0};
score=0;combo=0;comboTimer=0;speed=2.8;frameCount=0;distance=0;waveOffset=0;

requestAnimationFrame(loop);
</script>
</body>
</html>
